# Verificação automática. Em inglês porque é configuração de ferramenta, como o
# resto do código; os documentos e as mensagens de commit seguem em português.
#
# Isto NÃO publica. O deploy é do Cloudflare, disparado por push na main, e
# manter as duas coisas separadas evita guardar um token de deploy aqui.
name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Retorno rápido: o que quebra na maioria das vezes, em cerca de um minuto.
  quick:
    name: types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # Os onze testes que a rápida pula.
  #
  # Sem as tabelas eles se pulam sozinhos — e pular em silêncio é o pior dos
  # mundos, porque são exatamente os que conferem o motor em TypeScript contra
  # o solucionador em C: que a enumeração canônica bate índice a índice, e que
  # jogar a partida inteira pela tabela dá 283, 401 e 524 lances.
  #
  # Custa seis minutos de solver. Num repositório público o minuto é de graça, e
  # a verificação é a coisa que este projeto tem de próprio.
  tables:
    name: against the generated tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # As tabelas sao funcao pura do C: mesmo solver, mesmos bytes. Entao a
      # chave do cache e o hash do que as deriva — nao a data, nao o commit.
      #
      # Sem isto todo PR pagava seis minutos de solver, inclusive os que so
      # mexem em CSS. Com isto, so paga quem mexeu no que gera as tabelas.
      #
      # Os v_*.bin ficam de fora de proposito: sao estado de convergencia, 41 MB
      # cada, e nao entram em nada que o site consuma.
      - id: cache
        uses: actions/cache@v4
        with:
          path: tools/tabela-*.bin
          key: tables-${{ hashFiles('tools/*.c', 'tools/Makefile') }}

      # Os alvos do sorteio sao FORCE de proposito — a tabela existir nao
      # significa que convergiu —, entao o make refaria tudo mesmo com o cache
      # quente. A condicao e o que torna o cache util.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: generate the five production tables
        run: cd tools && make tabelas

      - name: fail if any test silently skipped
        run: |
          npm test 2>&1 | tee /tmp/out
          if grep -q "skipped" /tmp/out; then
            echo "::error::algum teste foi pulado — as tabelas deveriam estar presentes"
            exit 1
          fi
